name: Fedora Linux

on:
    push:
        branches: [ main ]
        paths-ignore:
            - AUTHORS.md
            - CODE_OF_CONDUCT.md
            - CONTRIBUTING.md
            - COPYING
            - COPYING.LIB
            - LICENSE-2.0.txt
            - LICENSE-BSD.txt
            - README.md
            - TODO.org
            - 'doc/**'
            - 'po/**'
            - 'osdeps/**'
            - 'utils/**'
            - '.github/**'

    pull_request:
        branches: [ main ]
        paths-ignore:
            - AUTHORS.md
            - CODE_OF_CONDUCT.md
            - CONTRIBUTING.md
            - COPYING
            - COPYING.LIB
            - LICENSE-2.0.txt
            - LICENSE-BSD.txt
            - README.md
            - TODO.org
            - 'doc/**'
            - 'po/**'
            - 'utils/**'

jobs:
    # Fedora on x86_64
    x86_64:
        # Use containers on their ubuntu latest image
        runs-on: ubuntu-latest

        # Set up the matrix of distributions to test
        strategy:
            matrix:
                container: ["fedora:rawhide", "fedora:latest"]

        container:
            image: ${{ matrix.container }}

        # All of these steps run from within the main source
        # directory, so think of that as your $PWD
        steps:
            # Set up
            - name: git clone requirements
              run: |
                  dnf upgrade -y
                  dnf install -y git

            # This means clone the git repo
            - uses: actions/checkout@v6

            # Within the container, install the dependencies, build,
            # and run the test suite
            - name: Build and run the test suite
              run: |
                  dnf install -y /usr/bin/make /usr/bin/awk
                  make instreqs
                  make debug
                  make check
                  ninja -C build coverage && ( curl -s https://codecov.io/bash | bash ) || :
